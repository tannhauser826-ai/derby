<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Derby MVP API Playground</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <h1>Derby MVP API Playground</h1>
      <p>심플한 프론트에서 API 전체 연결 테스트를 할 수 있습니다.</p>

      <section class="panel">
        <h2>설정</h2>
        <label>
          API Base URL
          <input id="baseUrl" value="http://localhost:3000/v1" />
        </label>
      </section>

      <section class="panel">
        <h2>1) GET /dates</h2>
        <button data-action="dates">호출</button>
      </section>

      <section class="panel two-col">
        <div>
          <h2>2) GET /recommendations</h2>
          <label>date <input id="recDate" value="2026-02-21" /></label>
          <label>mode
            <select id="recMode">
              <option value="">(none)</option>
              <option>beginner</option><option>date</option><option>family</option><option>photo</option><option>indoor</option>
            </select>
          </label>
          <label>limit <input id="recLimit" type="number" min="1" max="20" value="5" /></label>
          <button data-action="recommendations">호출</button>
        </div>
        <div>
          <h2>3) GET /races</h2>
          <label>date <input id="racesDate" value="2026-02-21" /></label>
          <button data-action="races">호출</button>
        </div>
      </section>

      <section class="panel two-col">
        <div>
          <h2>4) GET /races/:raceId</h2>
          <label>raceId <input id="raceId" value="d9b31dca-2894-4e8f-93a5-79ec3c00f601" /></label>
          <button data-action="raceDetail">호출</button>
        </div>
        <div>
          <h2>5) GET /races/:raceId/participants</h2>
          <label>raceId <input id="partRaceId" value="d9b31dca-2894-4e8f-93a5-79ec3c00f601" /></label>
          <button data-action="participants">호출</button>
        </div>
      </section>

      <section class="panel two-col">
        <div>
          <h2>6) GET /stories</h2>
          <label>type
            <select id="storyType">
              <option value="">(none)</option>
              <option>horse</option><option>jockey</option><option>trainer</option><option>race</option>
            </select>
          </label>
          <label>query <input id="storyQuery" placeholder="라이벌" /></label>
          <label>tags(csv) <input id="storyTags" placeholder="date,guide" /></label>
          <button data-action="stories">호출</button>
        </div>
        <div>
          <h2>7) GET /guides/seats</h2>
          <label>mode
            <select id="seatMode">
              <option>beginner</option><option>date</option><option>family</option><option>photo</option><option>indoor</option>
            </select>
          </label>
          <button data-action="seatGuide">호출</button>
        </div>
      </section>

      <section class="panel">
        <h2>8) GET /events</h2>
        <label>date(optional) <input id="eventsDate" placeholder="2026-02-21" /></label>
        <button data-action="events">호출</button>
      </section>

      <section class="panel">
        <h2>응답</h2>
        <pre id="output">아직 호출 전입니다.</pre>
      </section>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
